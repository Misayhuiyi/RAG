# ============================================================================
# RAG Enterprise Document Q&A System — Configuration
# ============================================================================

# ── Document Processing ──────────────────────────────────────────────────

documents:
  source_dir: "./data/documents"
  supported_formats: [".pdf", ".docx", ".md", ".txt"]
  chunk_size: 512          # characters per chunk
  chunk_overlap: 64        # overlap between consecutive chunks
  max_chunk_size: 1024     # hard upper limit before forced split

# ── Embedding ────────────────────────────────────────────────────────────

embedding:
  model_name: "BAAI/bge-large-zh-v1.5"
  device: "cpu"            # "cuda" or "cpu"
  batch_size: 32
  normalize: true

# ── Milvus Vector Database ───────────────────────────────────────────────

milvus:
  uri: "./data/vector_store/milvus.db"
  collection_name: "enterprise_docs"
  index_type: "IVF_FLAT"
  metric_type: "COSINE"
  nlist: 128

# ── Hybrid Retrieval ─────────────────────────────────────────────────────

retrieval:
  bm25_weight: 0.3         # α: BM25 weight in score fusion
  vector_weight: 0.7       # 1-α: vector weight in score fusion
  top_k_retrieval: 20      # k1: candidates per retrieval method
  top_k_fusion: 10         # k2: candidates after fusion (before rerank)
  top_k_final: 5           # k3: final chunks passed to LLM
  rerank_enabled: true
  rerank_model: "BAAI/bge-reranker-large"

# ── LLM Provider ─────────────────────────────────────────────────────────
# Supported providers: "openai", "ollama"

llm:
  provider: "openai"       # Change to "ollama" for local models

  openai:
    model: "gpt-4o"
    api_key: "${OPENAI_API_KEY}"   # Set OPENAI_API_KEY environment variable
    temperature: 0.1
    max_tokens: 2048

  ollama:
    model: "qwen2.5:7b"
    base_url: "http://localhost:11434"
    temperature: 0.1
    max_tokens: 2048

# ── Conversation Memory ──────────────────────────────────────────────────

memory:
  max_turns: 10            # Maximum conversation turns per session
  max_tokens: 4000         # Maximum tokens for conversation history

# ── Prompt Template ──────────────────────────────────────────────────────

prompt:
  system: "你是一个企业文档智能问答助手。请严格基于提供的文档内容回答问题。如果文档中没有相关信息，请明确说明'文档中未找到相关信息'，不要编造内容。"

  user_template: |
    参考文档：
    {context}

    对话历史：
    {history}

    用户问题：{question}

    请基于以上参考文档回答问题。要求：
    1. 严格基于文档内容，不要添加文档中没有的信息
    2. 引用具体的文档来源，如 [来源1]、[来源2]
    3. 如果文档中没有相关信息，请明确说明
    4. 回答应简洁、准确、有条理

# ── Server ───────────────────────────────────────────────────────────────

server:
  host: "0.0.0.0"
  port: 8000
  max_concurrency: 20

# ── Evaluation ───────────────────────────────────────────────────────────

evaluation:
  badcase_dir: "./data/badcases"
  test_set: "./data/test_questions.json"
